name: Go
on:
  pull_request: {}
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2  # v2
        with:
          filter_mode: nofilter
  Go-Unit-Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25.x', '1.24.x', '1.23.x', '1.22.x', '1.21.x' ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
        with:
          go-version: ${{ matrix.go-version }}
      - run: go version
      - run: go test ./... -v -coverprofile=coverage.out -covermode=atomic
      - uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  OpenFeature-Unit-Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25.x', '1.24.x', '1.23.x', '1.22.x' ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: ${{ matrix.go-version }}
      - run: go version
      - run: cd openfeature && go test ./... -v
